[project]
name = "quietpilot-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/control-api",
  "services/ingress",
  "services/worker",
  "services/agent",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
  "tests",
  "services/agent/tests",
  "services/control-api/tests",
  "services/ingress/tests",
  "services/worker/tests",
]
