[project]
name = "quietpilot-agent"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore>=1.9.1,<2",
    "pydantic>=2.11,<3",
    "strands-agents==1.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quietpilot_agent"]
